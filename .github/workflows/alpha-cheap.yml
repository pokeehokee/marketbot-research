name: Alpha cheap-contract screen (public research repo)

# Which signals seen at buy time make a contract priced 15c or less hit more often than its
# price says? research/alpha/cheap_screen.py has the method. It reads only rows the other two
# alpha workflows committed (no API calls) and scores only when both are fully read. The train
# selection is committed before the holdout is read, and each phase runs once per tag.
on:
  push:
    branches: ["main"]
    paths: ["research/alpha/CHEAP"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-cheap
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read parameters
        id: p
        run: grep -E '^(tag|tape|news)=' research/alpha/CHEAP >> "$GITHUB_OUTPUT"
      - name: Tests
        run: python3 -m unittest discover -s research/alpha -p 'test_*.py'
      - name: Are both inputs fully read?
        id: c
        run: |
          o=research/alpha/out
          tu=$(cat $o/${{ steps.p.outputs.tape }}-*-coverage.txt 2>/dev/null | awk '$1 ~ /^KX/ {s += $5} END {print s+0}')
          tn=$(ls $o/${{ steps.p.outputs.tape }}-*-coverage.txt 2>/dev/null | wc -l)
          nu=$(cat $o/${{ steps.p.outputs.news }}-*-coverage.txt 2>/dev/null | awk '$1 == "unread_total" {s += $2} END {print s+0}')
          nc=$(ls $o/cheap/${{ steps.p.outputs.news }}-*.csv.gz 2>/dev/null | wc -l)
          echo "tape unread $tu ($tn shards); news unread $nu, cheap files $nc"
          if [ "$tu" = "0" ] && [ "$tn" -ge 4 ] && [ "$nu" = "0" ] && [ "$nc" -ge 2 ]; then echo "ready=1" >> "$GITHUB_OUTPUT"; fi
      - name: Train phase (holdout not loaded)
        if: steps.c.outputs.ready == '1' && hashFiles(format('research/alpha/out/{0}-selected.json', steps.p.outputs.tag)) == ''
        run: |
          python3 -I research/alpha/cheap_screen.py --phase train --tag ${{ steps.p.outputs.tag }} \
            research/alpha/out/${{ steps.p.outputs.tape }}-*.csv.gz research/alpha/out/cheap/${{ steps.p.outputs.news }}-*.csv.gz
          cat research/alpha/out/${{ steps.p.outputs.tag }}-train.txt >> "$GITHUB_STEP_SUMMARY"
          git config user.name "alpha-cheap"
          git config user.email "actions@users.noreply.github.com"
          git add research/alpha/out
          git commit -m "alpha cheap-contract train selection: ${{ steps.p.outputs.tag }} (holdout sealed)"
          for i in 1 2 3 4 5; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 7)); done
      - name: Holdout phase (reads only the committed selection)
        if: steps.c.outputs.ready == '1' && hashFiles(format('research/alpha/out/{0}-holdout.txt', steps.p.outputs.tag)) == ''
        run: |
          git config user.name "alpha-cheap"
          git config user.email "actions@users.noreply.github.com"
          git pull origin "${GITHUB_REF_NAME}"
          python3 -I research/alpha/cheap_screen.py --phase holdout --tag ${{ steps.p.outputs.tag }} \
            research/alpha/out/${{ steps.p.outputs.tape }}-*.csv.gz research/alpha/out/cheap/${{ steps.p.outputs.news }}-*.csv.gz
          cat research/alpha/out/${{ steps.p.outputs.tag }}-holdout.txt >> "$GITHUB_STEP_SUMMARY"
          git add research/alpha/out
          git commit -m "alpha cheap-contract holdout: ${{ steps.p.outputs.tag }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i * 7)); done
      - name: Not ready
        if: steps.c.outputs.ready != '1'
        run: echo "Inputs not fully read yet; dispatch again once alpha-precursor and alpha-jumps finish." >> "$GITHUB_STEP_SUMMARY"
